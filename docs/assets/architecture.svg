<text x="1236.0" y="340.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#60A5FA" text-anchor="middle" opacity="1.0" transform="rotate(-90 1236 340)">books plan</text>
