<rect x="218.0" y="604.0" width="103.4" height="30.0" rx="15" fill="#101B33" opacity="1.0" stroke="#243455" stroke-width="1.0"/>
<text x="269.7" y="624.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#E6EDF3" text-anchor="middle" opacity="1.0" >atlas CLI</text>
<rect x="335.4" y="604.0" width="180.8" height="30.0" rx="15" fill="#101B33" opacity="1.0" stroke="#243455" stroke-width="1.0"/>
<text x="425.8" y="624.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#E6EDF3" text-anchor="middle" opacity="1.0" >MQL (local DuckDB)</text>
<rect x="530.2" y="604.0" width="146.4" height="30.0" rx="15" fill="#101B33" opacity="1.0" stroke="#243455" stroke-width="1.0"/>
<text x="603.4" y="624.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#E6EDF3" text-anchor="middle" opacity="1.0" >Static website</text>
<rect x="690.6" y="604.0" width="241.0" height="30.0" rx="15" fill="#101B33" opacity="1.0" stroke="#243455" stroke-width="1.0"/>
<text x="811.1" y="624.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#E6EDF3" text-anchor="middle" opacity="1.0" >pip install vizanix-atlas</text>
<path d="M1216 488 L1248 488" fill="none" stroke="#60A5FA" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
