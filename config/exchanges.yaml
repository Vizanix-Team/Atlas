# Vizanix Atlas - exchange registry
#
# Every fact in this file is either verified against the venue's official public
# API or explicitly marked unknown. Capability flags are asserted by contract
# tests against recorded fixtures (tests/contract/), so a claim here that the
# adapter cannot honour fails CI.
#
# Rate limits
# -----------
# Atlas deliberately runs far below every venue's published ceiling. The rates
# below are conservative fixed targets chosen so that a full-market collection
# completes inside a GitHub Actions job while issuing a small number of requests,
# not an attempt to approach a documented maximum.
#
# `documented_limit` is null throughout this release. Atlas had not re-verified
# each venue's current published ceiling at the time of writing, and recording a
# remembered number as though it were verified would be worse than recording
# nothing. docs/EXCHANGE_ADAPTERS.md lists this as an open item, and
# CONTRIBUTING.md requires the documented limit to be filled in whenever an
# adapter is added or revised. The conservative targets below do not depend on it.
#
# Availability
# ------------
# `enabled: false` always carries `disabled_reason`. A venue unreachable from one
# network is not a broken venue; see tests/fixtures/exchanges/AVAILABILITY.md.

schema_version: "1.0.0"

defaults:
  rate_limit:
    requests_per_second: 4.0
    burst: 4
    max_concurrency: 4
    request_timeout_seconds: 20.0
    max_retries: 3
    max_response_bytes: 50331648   # 48 MiB
    documented_limit: null

exchanges:

