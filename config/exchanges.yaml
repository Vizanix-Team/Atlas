      perpetual: true
      future: true
      option: true
      bulk_tickers: true
      bulk_instruments: true
      top_of_book_in_bulk: true
      quote_volume_in_bulk: true
      orderbook: true
      funding: true
      open_interest: true
      index_price: true
      mark_price: true
      server_time: true
      liquidations: not_available
