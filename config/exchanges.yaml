        Uses venue-specific contractions that collide with other venues' tickers
        (UST is Tether, not TerraUSD). Resolved from the venue's own published
        currency symbol and label maps, never from a hand-written guess.
      - "Tickers are positional arrays; only the documented 11 fields are read."

  # --------------------------------------------------------------------------
  # Disabled adapters. Each records why, and each is exercised by tests so the
  # code does not rot while it waits for the blocker to clear.
  # --------------------------------------------------------------------------
  - id: bybit
    display_name: Bybit
    enabled: false
    priority: core
    disabled_reason: >-
      Every Bybit API host (api.bybit.com, api.bytick.com, api.bybit.nl) returned
      HTTP 403 from a CloudFront edge with the body "The Amazon CloudFront
      distribution is configured to block access from your country" on 2026-09-27.
      No live payload could be captured, so no fixture exists and no parser could
      be written against a verified schema. Writing one from memory would violate
      the project's rule against inventing response fields. The adapter is a
      documented stub. To enable it, capture fixtures from an unrestricted network
      and follow the adapter checklist in CONTRIBUTING.md.
    documentation_url: https://bybit-exchange.github.io/docs/v5/intro
    capabilities:
      liquidations: unknown_semantics
    rate_limit:
      requests_per_second: 4.0

  - id: bitmex
    display_name: BitMEX
    enabled: false
    priority: standard
    disabled_reason: >-
      Reachable on 2026-09-27, but the instrument catalogue returned from the
      network used to build this release was not representative of the venue:
      /api/v1/instrument/active returned 12 unlisted placeholder spot pairs with
      listing dates in the year 2200, /api/v1/instrument/activeIntervals returned
      empty arrays, and XBTUSD (the venue's flagship perpetual) was reported with
      state "Settled". An adapter cannot be validated against a catalogue that
      does not reflect the venue's real state. Re-capture from an unrestricted
      network before enabling.
    documentation_url: https://www.bitmex.com/app/apiOverview
    capabilities:
      liquidations: unknown_semantics
    rate_limit:
      requests_per_second: 2.0

  - id: binance_derivatives
    display_name: Binance Derivatives
    enabled: false
    priority: core
    disabled_reason: >-
      fapi.binance.com (USD-M) and dapi.binance.com (COIN-M) both returned HTTP
      451 on 2026-09-27 with the venue's jurisdiction-restriction message. Unlike
      Binance spot, these hosts have no market-data-only mirror, so no fixture
      could be captured. Binance is one of the largest derivative venues, so its
      absence materially reduces Atlas's funding and open-interest coverage; this
      is stated in docs/LIMITATIONS.md rather than hidden.
    documentation_url: https://developers.binance.com/docs/derivatives
    capabilities:
      liquidations: unknown_semantics
    rate_limit:
      requests_per_second: 4.0
