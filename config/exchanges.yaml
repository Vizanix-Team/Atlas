      - "Derivative volume is published in contracts and in base units; both are preserved."
      # Verified 2026-09-27: nextFundingTime - fundingTime was 4h for some swaps
      # and 8h for others, so the interval is derived per instrument.
      - "Funding interval is derived from the venue's own funding timestamps, not assumed."

