# Retention housekeeping. Dry-run by default; only a manual dispatch with apply=true
# deletes anything, and every deletion is still gated by config/retention.yaml
# (tag allow/deny lists, minimum age, verified compacted replacement, deletion cap).
name: Maintenance

on:
  schedule:
    - cron: "43 3 * * *"
  workflow_dispatch:
    inputs:
      apply:
        description: "Actually delete eligible files (default is a dry run)."
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: maintenance
  cancel-in-progress: false

jobs:
  housekeeping:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .
      - name: Housekeeping
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLY: ${{ inputs.apply }}
        run: |
          if [ "$APPLY" = "true" ]; then
            atlas housekeeping --apply
          else
            atlas housekeeping
          fi
