# Weekly adapter-drift probe. Every snapshot already re-discovers each venue's
# instruments (bulk endpoints, see docs/EXCHANGE_ADAPTERS.md), so this workflow does not
# publish anything: it collects every venue once and writes a status table to the job
# summary, so a venue that has begun failing or shrinking is noticed without waiting for
# a data-quality report.
name: Discovery probe

on:
  schedule:
    - cron: "29 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .
      - name: Collect every enabled venue
        run: |
          for venue in $(atlas exchanges --json | python -c 'import json,sys; print(" ".join(r["slug"] for r in json.load(sys.stdin) if r["enabled"]))'); do
            atlas collect --exchange "$venue" --output probe || true
          done
      - name: Summarise
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          print("| venue | status | instruments | tickers | parse errors |")
          print("|---|---|---|---|---|")
          for path in sorted(pathlib.Path("probe").glob("*.json")):
              h = json.loads(path.read_text())["health"]
              print(f"| {h['venue_slug']} | {h['status']} | {h['instrument_count']} | {h['ticker_count']} | {h['parse_failures']} |")
          PY
